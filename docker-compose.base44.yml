services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sensotech
      POSTGRES_PASSWORD: sensotech_dev
      POSTGRES_DB: sensotech
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensotech"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://sensotech:sensotech_dev@db:5432/sensotech
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - WATCHPACK_POLLING=true
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npx next dev -H 0.0.0.0 -p 3000"

volumes:
  pgdata:
